name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install specification validators
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Check formatting and vet
        run: make lint

      - name: Test with race detector
        run: make race

      - name: Build commands
        run: make build

      - name: Validate schemas, examples, and OpenAPI references
        run: make validate
