name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '27 3 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - run: go build ./cmd/...
      - uses: github/codeql-action/analyze@v4
