          tar -xzf "$archive" -C "$source_dir" --strip-components=1

          # Preserve this one-time bootstrap workflow while replacing the rest
          # of the repository with the validated ASCP source tree.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$source_dir/" ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Repository source is already current."
            exit 0
          fi

          git commit -m "publish ASCP v0.2.0-draft.1 source"
          git push origin HEAD:master
