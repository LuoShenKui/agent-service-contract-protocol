name: Bootstrap ASCP source

"on":
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: ascp-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.repository == 'LuoShenKui/agent-service-contract-protocol' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.title == '[ASCP] Publish v0.2.0-draft.1'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install specification validators
        run: >-
          python -m pip install --disable-pip-version-check
          pyyaml==6.0.3 jsonschema==4.26.0

      - name: Materialize ASCP v0.2.0-draft.1
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$(mktemp -d)"
          archive="$work_dir/ascp.tar.gz"
          source_dir="$work_dir/source"
          mkdir -p "$source_dir"

          cat .bootstrap/ascp.tar.gz.b64.part* \
            | tr -d '\r\n' \
            | base64 --decode \
            > "$archive"

          tar -xzf "$archive" -C "$source_dir"

          source_root="$(find "$source_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_root"
          test -f "$source_root/go.mod"
          test -f "$source_root/README.md"

          rsync -a --delete --exclude='.git/' "$source_root/" ./

      - name: Validate materialized source
        run: make check

      - name: Commit complete source tree
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "publish ASCP v0.2.0-draft.1"
          git push origin "HEAD:${TARGET_BRANCH}"
