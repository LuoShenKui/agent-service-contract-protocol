name: Bootstrap ASCP source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-ascp.yml

permissions:
  contents: write

concurrency:
  group: ascp-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'LuoShenKui/agent-service-contract-protocol'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize ASCP v0.2.0-draft.1
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$(mktemp -d)"
          archive="$work_dir/ascp.tar.gz"
          source_dir="$work_dir/source"
          mkdir -p "$source_dir"

